name: Notificacion de Despliegue Cloud

on:
  push:
    branches: [ "proyecto-Cloud" ]

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar a Discord (SaaS)
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "content": "🚀 **Nuevo despliegue en proceso**\n- **Origen:** GitHub (SaaS)\n- **Destino:** Render (PaaS)\n- **Commit:** '"${{ github.sha }}"'\n- **Autor:** '"${{ github.actor }}"'"
               }' \
               ${{ secrets.DISCORD_WEBHOOK }}
