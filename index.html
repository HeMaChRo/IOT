<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 24px 32px;
        border-radius: 8px;
        border: 1px solid #ddd;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        margin-top: 0;
        margin-bottom: 13px;
        color: #333;
      }
      p {
        margin: 6px 0;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Héctor Manuel Chavira Robles</h1>
      <p>Ingeniería en Sistemas Computacionales</p>
      <p>IOT</p>
      <p>Noveno semestre</p>
    </div>
  </body>
</html>
